# CI for PolicyLens.
#
# The whole test suite runs here with NO API KEY and NO NETWORK MODEL
# DOWNLOAD, which is a property the tests were written for rather than a
# lucky accident: the agent graph runs against a scripted LLM, the API runs
# against a fake agent, and the retrieval tests inject a fake embedding model.
# A suite that needed secrets would not run on a fork's pull request, which is
# exactly when it is most useful.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# A second push to the same branch makes the first run's result irrelevant, so
# cancel it rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Its own job, not a step in `test`: it needs ruff and black and nothing
  # else, so it finishes in seconds while the test job is still installing
  # torch, and a formatting slip is reported without waiting for the suite.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the linters only
        # Pinned to the same versions as requirements-dev.txt and
        # .pre-commit-config.yaml. A newer black in CI than in the commit
        # hook fails the build on code the hook just approved.
        run: pip install ruff==0.17.3 black==26.10.1

      - name: ruff
        run: ruff check src/ tests/ scripts/ evaluation/ frontend/

      - name: black
        run: black --check src/ tests/ scripts/ evaluation/ frontend/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches requires-python >= 3.10 in pyproject.toml and the version
          # developed against.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check every module imports
        # Cheap and catches the failure a test suite can miss: a module that
        # only breaks at import time in a clean environment, because the
        # developer's machine had a package the requirements file forgot.
        run: |
          python - <<'PY'
          import importlib
          modules = [
              "src.config",
              "src.ingestion.loader", "src.ingestion.chunker", "src.ingestion.indexer",
              "src.retrieval.embeddings", "src.retrieval.store",
              "src.agent.graph", "src.agent.llm", "src.agent.prompts", "src.agent.state",
              "src.api.app", "src.api.schemas",
              "src.db.queries",
              "evaluation.dataset", "evaluation.metrics",
          ]
          for name in modules:
              importlib.import_module(name)
              print("ok", name)
          PY

      - name: Run tests
        # No GOOGLE_API_KEY and no GROQ_API_KEY are set. Anything marked
        # `llm` needs a live model and is deselected; everything else must
        # pass without one. Deselecting rather than skipping so a test that
        # quietly started needing the network shows up as a collection error
        # instead of a silent skip.
        run: pytest -m "not llm" --durations=10

      - name: Confirm the suite needs no API key
        # Guards the property above. If a test starts reading a key from the
        # environment, it will pass locally and fail here -- which is the
        # right way round.
        run: |
          if grep -rn "os.environ\[.GOOGLE_API_KEY.\]\|os.environ\[.GROQ_API_KEY.\]" tests/; then
            echo "A test reads an API key directly; the suite must run without one."
            exit 1
          fi
          echo "No test requires an API key."

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        # Built but not run: starting the services needs an API key, and the
        # build is what breaks in practice (a missing system library for a C
        # extension, or the embedding-model bake step failing).
        run: docker build -t policylens:ci .

      - name: Check the image runs as a non-root user
        # Asserted rather than assumed. An uploaded PDF is untrusted input
        # parsed by a C extension, so a regression to root here matters.
        run: |
          user=$(docker run --rm policylens:ci whoami)
          echo "image runs as: $user"
          test "$user" = "policylens"

      - name: Check the embedding model was baked in
        # If this regressed, the container would reach the network on its
        # first question instead of answering offline.
        run: |
          docker run --rm policylens:ci python - <<'PY'
          from sentence_transformers import SentenceTransformer
          import os
          os.environ["HF_HUB_OFFLINE"] = "1"
          SentenceTransformer("sentence-transformers/all-MiniLM-L6-v2")
          print("embedding model present offline")
          PY
