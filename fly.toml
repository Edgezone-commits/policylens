app = "policylens-api-wage01"
primary_region = "sin"

[build]
  dockerfile = "deploy/fly/Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "90s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # 512MB crash-loops: torch + chromadb + the embedding model do not fit.
  # Same ceiling docs/deploy.md already measured for the HF Space.
  memory = "1024mb"
